paths:
  data_raw: data/raw
  data_cleaned: data/cleaned
  data_aggregated: data/aggregated
  data_processed: data/processed

  feature_dataset: data/features/feature_dataset.parquet
  data_splits: data/splits
  data_preprocessed: data/preprocessed

  models_dir: models

  reports_dir: reports
  dataset_inventory: reports/dataset_inventory.csv
  profiling_dir: reports/profiling
  validation_dir: reports/validation
  cleaning_dir: reports/cleaning
  audit_dir: reports/dataset_audit
  master_dataset_reports: reports/master_dataset

target_engineering:
  source_column: groundwater_level
  group_column: District LGD Code
  date_column: Date
  forecast_horizon_days: 7
  transform: identity
  target_column_name: target

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

preprocessing:
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent
  scale_numeric: true
  onehot_min_frequency: 0.01
  random_state: 42

training:
  random_state: 42

  # Primary metric used to choose the production model
  selection_metric: rmse

  # Save every trained candidate model
  save_all_models: true

  # Optional evaluation outputs
  evaluate_by_district: true
  evaluate_extreme_events: true
  extreme_event_percentile: 10

  # Continue if optional libraries are unavailable
  skip_missing_optional_models: true

  models:

    persistence:
      enabled: true

    historical_mean:
      enabled: true

    linear_regression:
      enabled: true

    hist_gradient_boosting:
      enabled: true

      learning_rate: 0.05
      max_iter: 300
      max_depth: null
      min_samples_leaf: 20
      l2_regularization: 0.0

    random_forest:
      enabled: false

      n_estimators: 300
      max_depth: null
      min_samples_leaf: 2
      n_jobs: -1

    xgboost:
      enabled: false

    lightgbm:
      enabled: false

    catboost:
      enabled: false
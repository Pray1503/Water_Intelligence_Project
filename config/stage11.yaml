# =============================================================================
# Water Intelligence Platform
# Stage 11 - Intelligent Prediction & Inference Engine Configuration
# =============================================================================

stage11:
  name: "Intelligent Prediction & Inference Engine"
  version: "1.0.0"
  environment: "development"

# =============================================================================
# Stage 10 Frozen Artifacts (Read Only)
# =============================================================================
artifacts:
  base_directory: "models/stage10"

  champion_model: "champion_model.joblib"
  feature_schema: "feature_schema.json"
  metadata: "metadata.json"
  selection_report: "selection_report.json"

  read_only: true
  verify_artifacts: true
  verify_hashes: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  logger_name: "water_intelligence"

  level: "DEBUG"

  propagate: false

  console:
    enabled: true

  formatter: "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(name)s | %(funcName)s:%(lineno)d | %(message)s"

  date_format: "%Y-%m-%d %H:%M:%S"

# =============================================================================
# Prediction Engine Configuration
# =============================================================================
prediction:

  strict_validation: true

  startup_validation: true

  cache_model: true

  return_model_metadata: true

  enable_context: true

# =============================================================================
# Risk Engine Configuration
# =============================================================================
risk_engine:

  threshold_source: "configuration"

  calibration_status: "PENDING_MODEL_OUTPUT_VERIFICATION"

  labels:

    - VERY_LOW
    - LOW
    - MODERATE
    - HIGH
    - CRITICAL

  thresholds:

    very_low:

    low:

    moderate:

    high:

    critical:

# =============================================================================
# Performance Configuration
# =============================================================================
performance:

  singleton_model_loader: true

  lazy_loading: false

  model_cache: true

  startup_validation: true

  max_workers: 1

# =============================================================================
# API Configuration
# =============================================================================
api:

  prefix: "/api"

  endpoints:

    health: true

    model_info: true

    predict: true

# =============================================================================
# Debug Configuration
# =============================================================================
debug:

  log_inputs: true

  log_predictions: true

  log_execution_time: true

  log_validation: true

  log_transformations: true

  log_model_loading: true

  include_exception_context: true